name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Smoke simulation
        run: |
          python - <<'EOF'
          from src.simulation import disorder_average
          result = disorder_average(4, 0.10, 8, n_samples=5, warmup=4, seed=0)
          assert result['mean'] >= 0, f"negative entropy: {result['mean']}"
          assert result['sem'] >= 0,  f"negative SEM: {result['sem']}"
          print(f"smoke ok  S={result['mean']:.4f} +/- {result['sem']:.4f}")
          EOF
